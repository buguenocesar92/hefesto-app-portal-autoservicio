; Configuracion de PHP para el portal.
; valores pensados para una PyME: carga baja y errores visibles.

[PHP]
; El limite de memoria tiene que holgar para el procesamiento de archivos.
memory_limit = 256M

; Errores a pantalla solo en desarrollo: en produccion un error con detalle
; puede mostrar rutas internas o consultas SQL a un visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Fecha y hora: el portal muestra fechas en horario de Chile.
date.timezone = America/Santiago

; Sessions y cookies
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

; No exponer la version de PHP en los headers.
expose_php = Off

; Rutas
file_uploads = On
upload_max_filesize = 16M
post_max_size = 20M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0